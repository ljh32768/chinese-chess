<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>局域网象棋</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <!-- ========== 连接服务器（客户端启动后的第一个板块；浏览器打开时锁定） ========== -->
  <section id="screen-servers" class="screen active">
    <div class="menu_box">
      <div class="menu_info wide" id="server-panel">
        <p class="info-title">连接服务器</p>
        <div class="server-manual">
          <input type="text" id="server-addr" autocomplete="off" placeholder="192.168.1.42:7777">
          <button type="button" class="btn small" id="btn-server-connect">连接</button>
        </div>
        <div class="scan-actions">
          <button type="button" class="btn small" id="btn-server-scan">搜索局域网</button>
          <button type="button" class="btn small" id="btn-server-list">刷新列表</button>
        </div>
        <div class="server-list" id="server-list"></div>
        <p class="hint" id="server-msg"></p>
      </div>
      <a id="btn-server-enter">进入游戏</a>
    </div>
  </section>

  <!-- ========== 首页：木质菜单（参考项目风格） ========== -->
  <section id="screen-home" class="screen">
    <div class="home-corner">
      <button type="button" class="chip" id="server-chip" title="点击查看 / 切换服务器">服务器：—</button>
      <button type="button" class="chip" id="acct-chip" title="注册 / 登录">登录 / 注册</button>
    </div>
    <div class="menu_wrap">
      <div class="menu_box">
        <div class="menu_init" id="menu-index">
          <a id="btn-create">创建房间</a>
          <a id="btn-show-join">加入房间</a>
          <a id="btn-create-ai">人机对弈</a>
          <a id="btn-history">对局回顾</a>
          <a id="btn-skin">更换皮肤</a>
        </div>
        <div class="menu_dy" id="menu-create" hidden>
          <div class="menu_info">
            <div class="menu_fh" id="btn-create-back" title="返回"></div>
            <label for="create-pass">房间口令（可选）</label>
            <input type="password" id="create-pass" autocomplete="off" placeholder="留空即任何人可加入">
            <p class="hint">设置口令后，对手需输入口令才能加入</p>
          </div>
          <a id="btn-create-start">创建房间</a>
        </div>
        <div class="menu_dy" id="menu-ai" hidden>
          <div class="menu_info">
            <div class="menu_fh" id="btn-ai-back" title="返回"></div>
            <label><input name="ai-depth" type="radio" value="2"> 菜鸟水平</label>
            <label><input name="ai-depth" type="radio" value="3" checked> 中级水平</label>
            <label><input name="ai-depth" type="radio" value="4"> 高手水平</label>
            <p class="hint">本地对弈，无需连接服务器</p>
          </div>
          <a id="btn-ai-start">开始对弈</a>
        </div>
        <div class="menu_dy" id="menu-acct" hidden>
          <div class="menu_info">
            <div class="menu_fh" id="btn-acct-back" title="返回"></div>
            <label for="acct-user">用户名</label>
            <input type="text" id="acct-user" autocomplete="username" placeholder="3-16 位字母 / 数字 / 下划线">
            <label for="acct-pwd">密码</label>
            <input type="password" id="acct-pwd" autocomplete="current-password" placeholder="至少 4 位">
            <div class="scan-actions">
              <button type="button" class="btn small" id="btn-login">登 录</button>
              <button type="button" class="btn small" id="btn-register">注 册</button>
            </div>
            <button type="button" class="btn small danger" id="btn-logout" hidden>退出登录</button>
            <p class="hint" id="acct-msg"></p>
          </div>
        </div>
      </div>
      <p class="home-hint" id="home-hint"></p>
    </div>
  </section>

  <!-- ========== 等待对手（版块与挂板内框对齐：实测素材内框 x10..290 / y158..395） ========== -->
  <section id="screen-host" class="screen">
    <div class="menu_box">
      <div class="menu_info wide">
        <div class="menu_fh" id="btn-cancel-host" title="取消"></div>
        <p class="info-title">等待对手加入<i class="spinner" aria-hidden="true"></i></p>
        <div class="ip-box" id="ip-box" title="点击复制房间号">
          <div class="ip-label">房间号（点击复制）</div>
          <div class="ip-value" id="host-ip">—</div>
        </div>
        <p class="hint" id="room-pass-hint"></p>
        <div class="side_pick">
          <div class="side_opts" id="side-opts">
            <button type="button" class="side_opt" data-mode="random">随机黑红</button>
            <button type="button" class="side_opt" data-mode="guess">猜先</button>
            <button type="button" class="side_opt" data-mode="b">黑</button>
            <button type="button" class="side_opt" data-mode="r">红</button>
          </div>
          <p class="side_hint" id="side-hint">先手（红方）：房主执红先行</p>
        </div>
        <button type="button" class="btn small" id="btn-invite-host">邀请在线玩家</button>
        <p class="hint" id="host-wait">让对方在「加入房间」中输入上方房间号</p>
      </div>
    </div>
  </section>

  <!-- ========== 加入房间：房间列表（需先连接服务器） ========== -->
  <section id="screen-join" class="screen">
    <div class="menu_box">
      <div class="menu_info">
        <div class="menu_fh" id="btn-join-back" title="返回"></div>
        <label for="join-room">房间号</label>
        <input type="text" id="join-room" autocomplete="off" placeholder="6 位数字">
        <div class="scan-actions">
          <button type="button" class="btn small" id="btn-rooms">刷新房间</button>
          <button type="button" class="btn small" id="btn-spectate">观 战</button>
        </div>
        <div class="room-list" id="room-list"></div>
        <label for="join-pwd" id="join-pwd-label" hidden>口令（房间已上锁）</label>
        <input type="password" id="join-pwd" autocomplete="off" placeholder="请输入房间口令" hidden>
        <p class="hint" id="join-msg"></p>
      </div>
      <a id="btn-connect">加入房间</a>
    </div>
  </section>

  <!-- ========== 对局 ========== -->
  <section id="screen-game" class="screen">
    <div class="game-layout">
      <div class="chess-box">
        <canvas id="board" width="523" height="580"></canvas>
        <div class="bn_box">
          <div id="actions-play">
            <input type="button" id="btn-undo" value="悔　棋">
            <input type="button" id="btn-draw" value="和　棋">
            <input type="button" id="btn-resign" value="认　输">
            <input type="button" id="btn-leave" value="离　开">
          </div>
          <div id="actions-over" hidden>
            <input type="button" id="btn-play-again" value="再来一局">
            <input type="button" id="btn-home" value="返回首页">
          </div>
          <div id="actions-spectate" hidden>
            <input type="button" id="btn-spectate-leave" value="离开观战">
          </div>
        </div>
      </div>
      <aside class="panel">
        <div class="player-row" id="p-top">
          <span class="dot"></span>
          <span class="pname" id="p-top-name">对手</span>
          <span class="tag" id="p-top-tag"></span>
        </div>
        <div class="player-row" id="p-bottom">
          <span class="dot"></span>
          <span class="pname" id="p-bottom-name">你</span>
          <span class="tag" id="p-bottom-tag"></span>
        </div>
        <div class="status-box" id="status-box">准备开始</div>
        <div class="req-hint" id="req-hint" hidden></div>
        <div class="panel-box">
          <div class="cap-row"><span class="cap-label">红方吃子</span><span class="cap-list" id="cap-red-list">—</span></div>
          <div class="cap-row"><span class="cap-label">黑方吃子</span><span class="cap-list" id="cap-black-list">—</span></div>
        </div>
        <div class="role-hint" id="role-hint"></div>
        <input type="button" id="btn-invite" value="邀请在线玩家" hidden>
      </aside>
    </div>
  </section>

  <!-- ========== 对局回顾（列表） ========== -->
  <section id="screen-history" class="screen">
    <div class="review_box">
      <div class="review_head">
        <span class="menu_fh" id="btn-history-back" title="返回"></span>
        <span class="review_title">对局回顾</span>
        <button type="button" class="btn small review_refresh" id="btn-history-refresh">刷新</button>
      </div>
      <div class="review_cols">
        <span class="rv-vs">红黑方</span>
        <span class="rv-first">取先方式</span>
        <span class="rv-time">时间</span>
        <span class="rv-result">胜负</span>
      </div>
      <div class="review_list" id="history-list"></div>
    </div>
  </section>

  <!-- ========== 复盘（右箭头逐步 + AI 推荐） ========== -->
  <section id="screen-replay" class="screen">
    <div class="game-layout">
      <div class="chess-box">
        <canvas id="replay-board" width="523" height="580"></canvas>
        <div class="bn_box">
          <input type="button" id="btn-replay-first" value="开局 ⏮">
          <input type="button" id="btn-replay-prev" value="◀ 上一步">
          <input type="button" id="btn-replay-next" value="下一步 ▶">
          <input type="button" id="btn-replay-last" value="末步 ⏭">
        </div>
        <div class="bn_box">
          <input type="button" id="btn-replay-back" value="返回列表">
        </div>
      </div>
      <aside class="panel">
        <div class="panel-box">
          <div class="box-title">对局信息</div>
          <div class="replay-info" id="replay-info"></div>
        </div>
        <div class="panel-box">
          <div class="box-title">当前局面</div>
          <div class="replay-step" id="replay-step">第 0 / 0 步</div>
        </div>
        <div class="panel-box">
          <div class="box-title">AI 推荐</div>
          <div class="replay-hint" id="replay-hint">—</div>
        </div>
      </aside>
    </div>
  </section>

</div>

<!-- ========== 通用弹层 ========== -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="btns" id="modal-btns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 音效：常驻音频元素 + 预加载（与参考项目一致，sound.ts 只负责 play()） -->
<audio src="./assets/audio/click.wav" id="click-audio" preload="auto"></audio>
<audio src="./assets/audio/select.wav" id="select-audio" preload="auto"></audio>

<script type="module" src="./app.js"></script>
</body>
</html>
