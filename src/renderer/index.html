<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>局域网象棋</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <!-- ========== 首页 ========== -->
  <section id="screen-home" class="screen active">
    <div class="card">
      <div class="logo">♟</div>
      <h1>局域网象棋</h1>
      <p class="sub">两人实时对战 · 主机权威</p>
      <div class="btns">
        <button class="btn primary" id="btn-create">创建对局</button>
        <button class="btn ghost" id="btn-show-join">加入对局</button>
      </div>
      <p class="hint" id="home-hint"></p>
    </div>
  </section>

  <!-- ========== 主机等待 ========== -->
  <section id="screen-host" class="screen">
    <div class="card">
      <h2>等待对手加入</h2>
      <div class="ip-box">
        <div class="ip-label">本机地址</div>
        <div class="ip-value" id="host-ip">—</div>
      </div>
      <div class="spinner"></div>
      <p class="hint" id="host-wait">请让对方在「加入对局」中输入上方地址</p>
      <div class="btns" style="margin-top:22px;">
        <button class="btn ghost" id="btn-cancel-host">取消</button>
      </div>
    </div>
  </section>

  <!-- ========== 加入 ========== -->
  <section id="screen-join" class="screen">
    <div class="card">
      <h2>加入对局</h2>
      <label for="join-ip">主机地址</label>
      <input id="join-ip" autocomplete="off" placeholder="192.168.1.42">
      <label for="join-port">端口</label>
      <input id="join-port" autocomplete="off" placeholder="7777" value="7777">
      <p class="hint" id="join-msg"></p>
      <div class="btns" style="margin-top:18px;">
        <button class="btn primary" id="btn-connect">连接</button>
        <button class="btn ghost" id="btn-join-back">返回</button>
      </div>
    </div>
  </section>

  <!-- ========== 对局 ========== -->
  <section id="screen-game" class="screen">
    <div class="game-layout">
      <div class="board-area">
        <svg id="board" viewBox="0 0 516 572" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <aside class="panel">
        <div class="player-row" id="p-top">
          <span class="dot"></span>
          <span class="pname" id="p-top-name">对手</span>
          <span class="tag" id="p-top-tag"></span>
        </div>
        <div class="player-row" id="p-bottom">
          <span class="dot"></span>
          <span class="pname" id="p-bottom-name">你</span>
          <span class="tag" id="p-bottom-tag"></span>
        </div>
        <div class="status-box" id="status-box">准备开始</div>
        <div class="actions">
          <button class="btn small" id="btn-resign">认输</button>
          <button class="btn small" id="btn-draw">和棋</button>
          <button class="btn small" id="btn-restart">重开</button>
          <button class="btn small danger" id="btn-leave">离开</button>
        </div>
        <div class="role-hint" id="role-hint"></div>
      </aside>
    </div>
  </section>

</div>

<!-- ========== 通用弹层 ========== -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="btns" id="modal-btns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
