<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>局域网象棋</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <!-- ========== 首页：木质菜单（参考项目风格） ========== -->
  <section id="screen-home" class="screen active">
    <div class="menu_wrap">
      <div class="menu_box">
        <div class="menu_init" id="menu-index">
          <a id="btn-create">创建对局</a>
          <a id="btn-show-join">加入对局</a>
          <a id="btn-create-ai">人机对弈</a>
          <a id="btn-skin">更换皮肤</a>
        </div>
        <div class="menu_dy" id="menu-ai" hidden>
          <div class="menu_info">
            <div class="menu_fh" id="btn-ai-back" title="返回"></div>
            <label><input name="ai-depth" type="radio" value="2"> 菜鸟水平</label>
            <label><input name="ai-depth" type="radio" value="3" checked> 中级水平</label>
            <label><input name="ai-depth" type="radio" value="4"> 高手水平</label>
          </div>
          <a id="btn-ai-start">开始对弈</a>
        </div>
      </div>
      <p class="home-hint" id="home-hint"></p>
    </div>
  </section>

  <!-- ========== 主机等待 ========== -->
  <section id="screen-host" class="screen">
    <div class="menu_box">
      <div class="menu_info">
        <div class="menu_fh" id="btn-cancel-host" title="取消"></div>
        <p class="info-title">等待对手加入</p>
        <div class="ip-box">
          <div class="ip-label">本机地址</div>
          <div class="ip-value" id="host-ip">—</div>
        </div>
        <button class="btn small" id="btn-copy-ip">复制地址</button>
        <p class="hint" id="host-wait">请让对方在「加入对局」中输入上方地址</p>
        <div class="spinner"></div>
      </div>
    </div>
  </section>

  <!-- ========== 加入 ========== -->
  <section id="screen-join" class="screen">
    <div class="menu_box tall">
      <div class="menu_info">
        <div class="menu_fh" id="btn-join-back" title="返回"></div>
        <label for="join-ip">主机地址</label>
        <input type="text" id="join-ip" autocomplete="off" placeholder="192.168.1.42">
        <label for="join-port">端口</label>
        <input type="text" id="join-port" autocomplete="off" placeholder="7777" value="7777">
        <div class="scan-actions">
          <button class="btn small" id="btn-spectate">观 战</button>
          <button class="btn small" id="btn-scan">搜索主机</button>
        </div>
        <p class="hint" id="join-msg"></p>
        <div class="scan-result" id="scan-result" hidden></div>
      </div>
      <a id="btn-connect">连 接</a>
    </div>
  </section>

  <!-- ========== 对局 ========== -->
  <section id="screen-game" class="screen">
    <div class="game-layout">
      <div class="chess-box">
        <canvas id="board" width="523" height="580"></canvas>
        <div class="bn_box">
          <div id="actions-play">
            <input type="button" id="btn-undo" value="悔　棋">
            <input type="button" id="btn-draw" value="和　棋">
            <input type="button" id="btn-resign" value="认　输">
            <input type="button" id="btn-leave" value="离　开">
          </div>
          <div id="actions-over" hidden>
            <input type="button" id="btn-play-again" value="再来一局">
            <input type="button" id="btn-home" value="返回首页">
          </div>
          <div id="actions-spectate" hidden>
            <input type="button" id="btn-spectate-leave" value="离开观战">
          </div>
        </div>
      </div>
      <aside class="panel">
        <div class="player-row" id="p-top">
          <span class="dot"></span>
          <span class="pname" id="p-top-name">对手</span>
          <span class="tag" id="p-top-tag"></span>
        </div>
        <div class="player-row" id="p-bottom">
          <span class="dot"></span>
          <span class="pname" id="p-bottom-name">你</span>
          <span class="tag" id="p-bottom-tag"></span>
        </div>
        <div class="status-box" id="status-box">准备开始</div>
        <div class="req-hint" id="req-hint" hidden></div>
        <div class="panel-box">
          <div class="box-title">棋谱</div>
          <div class="move-list" id="move-list">尚未走子</div>
        </div>
        <div class="panel-box">
          <div class="cap-row"><span class="cap-label">红方吃子</span><span class="cap-list" id="cap-red-list">—</span></div>
          <div class="cap-row"><span class="cap-label">黑方吃子</span><span class="cap-list" id="cap-black-list">—</span></div>
        </div>
        <div class="role-hint" id="role-hint"></div>
      </aside>
    </div>
  </section>

</div>

<!-- ========== 通用弹层 ========== -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="btns" id="modal-btns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
